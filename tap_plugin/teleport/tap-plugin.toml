manifest_version = "0"
plugin_version = "0.2.0"
requires_tap = ">=0.2.2"
slug = "teleport"
name = "TAP Teleport"
description = "Teleport infrastructure access as grid vocabulary: a cluster's HA deployment, certificate authorities, roles, identities, join paths, access governance and protected resources, with a reusable /teleport operator page."

# Every edge file that reaches another platform (compute, storage, keys, IdPs, fronted targets,
# joining workloads) leaves that end open, so no edge file names another plugin's type. The one
# dependency is a node declaration: teleport_user declares identity_core's HELD_BY_HUMAN to its
# neutral human (req-teleport-person-link). Vocabulary only: no Python import; install + migrate order.
depends_on = [
    { slug = "identity_core", min_version = "0.1.3", note = "Vocabulary dependency: teleport__teleport_user declares HELD_BY_HUMAN__identity_core to identity_core__human, the one person every system's account resolves to." },
]

# Pure Python, no crypto (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

[models]
teleport__teleport_cluster = "tap_plugin.teleport.models.teleport_cluster.TeleportCluster"
